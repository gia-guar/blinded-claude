# Data catalog. Only `dummy_data` (input) and `model_metrics` (output) are
# persisted. The intermediate datasets (X_train/X_test/y_train/y_test/model)
# are not listed, so Kedro keeps them in memory and they never hit disk.

dummy_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/dummy_data.csv

# data/claude_visible_metrics is the ONLY content that leaves the secure side.
# The server filters it: numeric leaves only, nesting to depth 4, 200 keys per
# run. Strings, booleans and lists are dropped silently. Versioned, so each run
# writes its own file and runs can be compared. (kedro-datasets 7.x removed the
# old tracking.MetricsDataset; json.JSONDataset is the functional equivalent.)
model_metrics:
  type: json.JSONDataset
  filepath: data/claude_visible_metrics/model_metrics.json
  versioned: true
